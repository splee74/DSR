name: 기준금리 자동 수집

on:
  schedule:
    - cron: '1 6 15-21 * *'  # COFIX: 매월 15~21일 15:01 (한국 시간) — 공시일 하루만 실제 조회
    - cron: '1 6 * * 3'      # 단기 COFIX: 매주 수요일 15:01 (한국 시간)
    # 금융채: 하루 4번 확인 (단기 COFIX도 함께). 빠진 평일은 다음 실행 때 자동으로 채움
    # GitHub 예약은 정각에 몰려 자주 누락되므로 5분 늦춰 실행
    - cron: '5 10 * * 1-5'   # 평일 19:05 (한국 시간)
    - cron: '5 14 * * 1-5'   # 평일 23:05 (한국 시간)
    - cron: '5 0 * * 2-6'    # 화~토 09:05 (한국 시간) — 전날 값 확인
    - cron: '5 2 * * 2-6'    # 화~토 11:05 (한국 시간) — 전날 값 확인
  workflow_dispatch:          # GitHub 화면에서 바로 실행 (COFIX·금융채 모두)
  push:                       # 빠진 날 채우기: .github/bond-fill-date 에 날짜를 넣어 올리면 그날 금융채만 조회
    paths: ['.github/bond-fill-date']

permissions:
  contents: write
  pages: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 기준금리 가져오기
        run: node scripts/fetch-base-rates.mjs ${{ github.event_name == 'push' && 'fill' || github.event.schedule == '1 6 15-21 * *' && 'cofix' || github.event.schedule == '1 6 * * 3' && 'short' || startsWith(github.event.schedule, '5 ') && 'bond' || 'all' }} ${{ github.event_name == 'push' && '$(cat .github/bond-fill-date)' || '' }}
      - name: 바뀐 경우에만 저장
        id: save
        run: |
          if git diff --quiet -- base-rates.json; then
            echo "변경 없음"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add base-rates.json
          git commit -m "기준금리 자동 업데이트"
          git pull --rebase origin main   # 그사이 관리자가 금리를 저장했어도 함께 올라가도록
          git push
          echo "pushed=1" >> "$GITHUB_OUTPUT"
      - name: 사이트(GitHub Pages) 다시 만들기
        if: steps.save.outputs.pushed == '1'
        run: |
          curl -s -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
