<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#03c75a">
<link rel="icon" type="image/png" href="../icon-192.png?v=2">
<title>계산기 모음</title>
<!-- 계산기 모음 목록 -->
<style>
:root{--brand:#03c75a;--brand-ink:#008a3e;--brand-weak:#eafaf1;--bg:#f5f6f7;--card:#fff;--line:#e3e5e8;--text:#1e1e23;--sub:#4e5258;--muted:#8b8f96;--header:#fffffff0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--brand:#1ed36f;--brand-ink:#4fe393;--brand-weak:#10301f;--bg:#141416;--card:#1d1e21;--line:#323338;--text:#ececee;--sub:#b9bbc2;--muted:#8a8d95;--header:#1d1e21ee;color-scheme:dark}}
:root[data-theme="dark"]{--brand:#1ed36f;--brand-ink:#4fe393;--brand-weak:#10301f;--bg:#141416;--card:#1d1e21;--line:#323338;--text:#ececee;--sub:#b9bbc2;--muted:#8a8d95;--header:#1d1e21ee;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Pretendard,"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:15px;line-height:1.55;letter-spacing:-.2px}
.top{position:sticky;top:0;background:var(--header);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700}
h1{margin:0;font-size:17px}h1 span{display:block;font-size:12px;color:var(--muted);font-weight:400;margin-top:-2px}
.badge{margin-left:auto;font-size:12px;font-weight:600;color:var(--brand-ink);background:var(--brand-weak);border-radius:999px;padding:4px 10px}
main{max-width:760px;margin:0 auto;padding:18px 16px 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
a.tile{display:flex;flex-direction:column;gap:10px;background:var(--card);border-radius:18px;padding:18px 16px;text-decoration:none;color:inherit;border:1.5px solid transparent;transition:.15s}
a.tile:hover{border-color:var(--brand-ink)}
.ic{width:44px;height:44px;border-radius:14px;background:var(--brand-weak);color:var(--brand-ink);display:grid;place-items:center}
.ic svg{width:24px;height:24px}
a.tile b{font-size:15.5px}a.tile small{color:var(--muted);font-size:12.5px;line-height:1.5}
.no{font-size:11px;color:var(--brand-ink);font-weight:700}
p.foot{font-size:12.5px;color:var(--muted);margin-top:18px;line-height:1.7}
.home{margin-left:auto;display:inline-flex;align-items:center;gap:2px;padding:7px 12px 7px 8px;border-radius:999px;background:var(--brand);color:#fff;font-size:13px;font-weight:700;text-decoration:none;white-space:nowrap}
.home:hover{background:var(--brand-dark,#02b351)}
.home+.badge{margin-left:0}
/* 시작 화면과 같은 아이콘 · 가로 2개씩 5줄 · 아래에 짧은 설명 */
.icons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px clamp(12px,4vw,24px);max-width:420px;margin:0 auto}
.ic-tile{display:flex;flex-direction:column;align-items:center;gap:8px;text-decoration:none;color:inherit;-webkit-tap-highlight-color:transparent}
.ic-tile img{display:block;width:100%;height:auto;aspect-ratio:220/288;border-radius:12%/9%;box-shadow:0 3px 10px #0b5d2e2e;transition:transform .15s ease}
.ic-tile small{font-size:13px;line-height:1.45;color:var(--sub);text-align:center;word-break:keep-all}
.ic-tile:hover img{transform:translateY(-3px)}
.ic-tile:active img{transform:scale(.96)}
.ic-tile:focus-visible{outline:3px solid var(--brand);outline-offset:4px;border-radius:12px}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="logo">₩</div>
  <h1>계산기 모음<span>대출 · 부동산 · 세금 · 생활</span></h1>
  <a class="home" href="../index.html?home" aria-label="처음 화면으로"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>처음으로</a>
</div></header>
<main>
  <div class="icons">
    <a class="ic-tile" href="loan.html" aria-label="대출이자 계산기 · 월 상환액 · 총이자 · 상환 스케줄"><img src="img/i01.webp" alt="" width="220" height="288" decoding="async"><small>월 상환액 · 총이자 · 상환 스케줄</small></a>
    <a class="ic-tile" href="prepay.html" aria-label="중도상환수수료 계산기 · 수수료 · 갈아타기 이득 비교"><img src="img/i02.webp" alt="" width="220" height="288" decoding="async"><small>수수료 · 갈아타기 이득 비교</small></a>
    <a class="ic-tile" href="rent.html" aria-label="전월세 전환 계산기 · 전세↔월세 · 보증금 조정 · 전환율"><img src="img/i03.webp" alt="" width="220" height="288" decoding="async"><small>전세↔월세 · 보증금 조정 · 전환율</small></a>
    <a class="ic-tile" href="broker.html" aria-label="중개보수 계산기 · 부동산 복비 · 법정 상한 요율"><img src="img/i04.webp" alt="" width="220" height="288" decoding="async"><small>부동산 복비 · 법정 상한 요율</small></a>
    <a class="ic-tile" href="saving.html" aria-label="예·적금 이자 계산기 · 세후 이자 · 만기 수령액 · 목표 금액"><img src="img/i05.webp" alt="" width="220" height="288" decoding="async"><small>세후 이자 · 만기 수령액 · 목표 금액</small></a>
    <a class="ic-tile" href="acqtax.html" aria-label="취득세 계산기 · 주택 매매 · 다주택 중과 · 생애최초"><img src="img/i06.webp" alt="" width="220" height="288" decoding="async"><small>주택 매매 · 다주택 중과 · 생애최초</small></a>
    <a class="ic-tile" href="salary.html" aria-label="연봉 실수령액 계산기 · 4대보험 · 소득세 · 월 실수령"><img src="img/i07.webp" alt="" width="220" height="288" decoding="async"><small>4대보험 · 소득세 · 월 실수령</small></a>
    <a class="ic-tile" href="area.html" aria-label="평수 변환 계산기 · ㎡ ↔ 평 · 전용 ↔ 공급평형"><img src="img/i08.webp" alt="" width="220" height="288" decoding="async"><small>㎡ ↔ 평 · 전용 ↔ 공급평형</small></a>
    <a class="ic-tile" href="apply.html" aria-label="청약 가점 계산기 · 무주택 · 부양가족 · 통장 (84점)"><img src="img/i09.webp" alt="" width="220" height="288" decoding="async"><small>무주택 · 부양가족 · 통장 (84점)</small></a>
    <a class="ic-tile" href="date.html" aria-label="날짜 계산 계산기 · D-day · 만 나이 · 임대차 만기"><img src="img/i10.webp" alt="" width="220" height="288" decoding="async"><small>D-day · 만 나이 · 임대차 만기</small></a>
  </div>
  
</main>
</body>
</html>
