<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>페이지를 찾을 수 없습니다 · DSR·DTI 계산기</title>
<script>
  // 고객관리(/cs/)의 화면 주소(예: /cs/customers/123)로 바로 들어오면 GitHub Pages 에는 그 파일이 없어서 이 페이지가 뜸
  // → /cs/?p=원래주소 로 보내면 고객관리 앱이 원래 화면을 열어 줌
  (function () {
    var l = location;
    if (l.pathname.indexOf('/cs/') === 0) {
      var rest = l.pathname.slice(3) + l.search + l.hash; // '/customers/123?x=1'
      l.replace('/cs/?p=' + encodeURIComponent(rest));
    }
  })();
</script>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f6f7;color:#1e1e23;font-family:Pretendard,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;text-align:center;padding:24px}
  a{display:inline-block;margin-top:16px;padding:10px 18px;border-radius:6px;background:#03c75a;color:#fff;font-weight:700;text-decoration:none}
</style>
</head>
<body>
  <div>
    <p>찾는 페이지가 없습니다.</p>
    <a href="/">DSR·DTI 계산기로 가기</a>
  </div>
</body>
</html>
